name: build-lib

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'projects/NarutoSenki/**'
      - 'cocos2dx/**'
      - 'CocosDenshion/**'
      - 'extensions/**'
      - 'scripting/**'
      - 'external/**'
      - '.github/workflows/build-lib.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 hanya untuk sdkmanager
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK platform / build-tools / NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "platform-tools" "ndk;21.4.7075529"

      - name: Point Gradle at NDK r21e
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      # JDK 8 untuk AGP 3.3.3
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Grant execute to gradlew
        working-directory: projects/NarutoSenki/proj.android-studio
        run: chmod +x gradlew

      - name: Build native lib only
        working-directory: projects/NarutoSenki/proj.android-studio
        run: ./gradlew :app:externalNativeBuildDebug --stacktrace --info

      - name: Locate .so
        if: always()
        run: find . -name "*.so" -not -path "*/ndk/*"

      - name: Upload .so
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-so
          path: |
            **/obj/local/**/*.so
            **/libs/**/*.so

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            projects/NarutoSenki/**/build.log
            projects/NarutoSenki/**/.cxx/**